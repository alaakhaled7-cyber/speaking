<!DOCTYPE html>
<html lang="en">
<head>
<title>Speak Up · Listening &amp; Speaking</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#26547C; --navy-deep:#183A57; --red:#E11D2A; --red-dark:#B8141F; --cyan:#22A6DD;
    --paper:#F3F6F9; --line:#D9E1E8; --ink:#1B2733; --muted:#5B6B7A; --white:#FFFFFF;
    --ok:#1E7F4F; --ok-bg:#E4F4EB; --warn-bg:#FDECEC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
  a{color:var(--navy)}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* header */
  header{background:var(--white);border-bottom:4px solid var(--navy)}
  .brand{display:flex;align-items:center;gap:16px;padding:14px 0}
  .brand img{width:56px;height:56px;border-radius:8px;flex:none}
  .brand .su{margin-left:auto}
  a.brand{text-decoration:none;color:inherit;cursor:pointer}
  a.brand:hover h1, a.brand:focus-visible h1{text-decoration:underline}
  .brand h1{margin:0;font-size:22px;font-weight:700;color:var(--navy);line-height:1.2}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}

  main{padding:28px 0 60px}
  h2{font-size:20px;margin:0 0 12px;color:var(--navy-deep)}

  /* level picker */
  .levels{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
  .levels button{border:2px solid var(--navy);background:var(--white);color:var(--navy);padding:9px 20px;border-radius:999px;font-weight:600;cursor:pointer}
  .levels button[aria-pressed="true"]{background:var(--navy);color:var(--white)}

  /* open-now panel — the one bold element */
  .now{background:var(--navy);color:var(--white);border-radius:14px;padding:28px 30px;margin-bottom:34px;position:relative;overflow:hidden}
  .now::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(34,166,221,.25)}
  .now .tag{display:inline-block;background:var(--red);color:#fff;font-weight:600;font-size:13px;padding:3px 12px;border-radius:999px;margin-bottom:12px}
  .now h3{margin:0;font-size:30px;line-height:1.2;font-weight:700;max-width:28ch}
  .now .lessons{margin:8px 0 22px;color:#D6E4F0;max-width:60ch}
  .start{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:17px;padding:13px 28px;border-radius:10px;position:relative;z-index:1}
  .start:hover{background:var(--red-dark)}
  .none{background:var(--white);border:2px dashed var(--line);border-radius:14px;padding:22px 26px;margin-bottom:34px;color:var(--muted)}
  .none strong{color:var(--ink)}

  /* term list */
  .term{list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--line);border-radius:12px}
  .term li{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
  .term li:first-child{border-top:0}
  .wk{width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center;text-align:center;line-height:1.05}
  .wk small{display:block;font-size:10px;color:var(--muted)}
  .wk b{font-size:18px;color:var(--navy)}
  .term .t{font-weight:600}
  .term .l{font-size:13px;color:var(--muted)}
  .pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap}
  .pill.open{background:var(--ok-bg);color:var(--ok)}
  .pill.closed{background:var(--paper);color:var(--muted)}
  .term li.is-open{background:#F7FBFF}

  footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* instructor */
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:24px}
  .signin{max-width:420px;margin:10px auto}
  label{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
  input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .btn{text-decoration:none;display:inline-block;border:0;background:var(--navy);color:#fff;font-weight:600;padding:10px 18px;border-radius:8px;cursor:pointer}
  .btn:hover{background:var(--navy-deep)}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.red{background:var(--red)} .btn.red:hover{background:var(--red-dark)}
  .btn[disabled]{opacity:.55;cursor:wait}
  .err{background:var(--warn-bg);color:var(--red-dark);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:14px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .bar h2{margin:0}
  .bar .sp{flex:1}
  .muted{color:var(--muted);font-size:13px}

  .star{display:inline-block;margin-top:2px;font-size:12px;font-weight:700;color:#8a5a00;background:#FFF4D6;border-radius:999px;padding:1px 8px;white-space:nowrap}
  .chsec{border:2px dashed #E3B341;border-radius:12px;padding:6px 16px 10px;margin-top:22px;background:#FFFBF0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
  .stat b{display:block;font-size:26px;color:var(--navy);line-height:1.2}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.todo b{color:var(--red)}

  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .filters label{margin:0 0 4px;font-size:12px;color:var(--muted)}
  .tablewrap{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--paper);font-weight:600;font-size:13px;color:var(--navy-deep);position:sticky;top:0}
  td.n,th.n{text-align:right}
  tr:last-child td{border-bottom:0}
  .mark{border:0;background:var(--red);color:#fff;font-weight:600;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:13px}
  .marked{border:0;background:none;color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline;font-size:14px;padding:0}
  .empty{padding:30px;text-align:center;color:var(--muted)}

  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--line)}
  .tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--red)}

  .ctl li{grid-template-columns:64px 1fr auto auto}
  .switch{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:13px}
  .switch.on{background:var(--ok);border-color:var(--ok);color:#fff}

  /* marking drawer */
  .scrim{position:fixed;inset:0;background:rgba(24,58,87,.45);display:none}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:#fff;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;display:flex;flex-direction:column}
  .drawer.show{transform:none;visibility:visible;box-shadow:-8px 0 30px rgba(0,0,0,.15);transition:transform .25s ease}
  .scrim.show{display:block}
  .drawer header{border:0;background:var(--navy);color:#fff;padding:18px 22px}
  .drawer header h3{margin:0;font-size:18px}
  .drawer header p{margin:2px 0 0;font-size:13px;color:#D6E4F0}
  .drawer .body{padding:20px 22px;overflow-y:auto;flex:1}
  .essay{white-space:pre-wrap;background:var(--paper);border-radius:10px;padding:16px;line-height:1.7;max-width:70ch}
  .scores{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .scores button{width:48px;height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;cursor:pointer;color:var(--ink)}
  .scores button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
  .drawer .foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

  .spark{vertical-align:middle}
  .chg{font-size:12px;font-weight:600;margin-left:6px}
  .chg.up{color:var(--ok)} .chg.down{color:var(--red-dark)} .chg.flat{color:var(--muted)}
  .meter{display:inline-block;width:56px;height:7px;background:var(--line);border-radius:9px;overflow:hidden;vertical-align:middle;margin-right:8px}
  .meter i{display:block;height:100%;background:var(--navy)}
  .skills{display:flex;gap:4px}
  .skills span{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--paper);color:var(--navy-deep)}
  .skills span.low{background:var(--warn-bg);color:var(--red-dark)}
  .status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .status.s0{background:var(--warn-bg);color:var(--red-dark)} .status.s1{background:#E6EEF6;color:var(--navy)} .status.s2{background:var(--ok-bg);color:var(--ok)}
  tr.prow{cursor:pointer} tr.prow:hover td{background:#F7FBFF}
  tr.detail td{background:var(--paper);white-space:normal}
  .qchips{display:flex;flex-wrap:wrap;gap:8px}
  .qchips span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
  .qchips span.miss{border-color:var(--red);color:var(--red-dark)}
  textarea.comment{width:100%;min-height:80px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit}
  /* ── quiz paper (exam template) ── */
  .paper{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:26px 30px;margin-bottom:18px}
  .cover{display:grid;grid-template-columns:70px 1fr 70px;gap:16px;align-items:center;margin-bottom:6px}
  .cover img{width:64px;height:64px;border-radius:8px}
  .cover table{border-collapse:collapse;width:100%;max-width:420px;margin:0 auto;font-size:14px}
  .cover td{border:1px solid #9AA8B5;padding:4px 10px;white-space:normal;text-align:left}
  .cover td:first-child{font-weight:600;width:48%}
  .cover tr:last-child td{border-bottom:1px solid #9AA8B5}
  .secbar{background:#DADDE1;text-align:center;font-weight:700;padding:8px;margin:26px -30px 18px;font-size:16px}
  .qitem{margin:0 0 18px}
  .qitem .qt{font-weight:600;margin-bottom:6px}
  .qitem .qt i{font-weight:400;color:var(--muted);font-size:13px}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;max-width:640px}
  .opt:hover{background:var(--paper)}
  .opt input{margin-top:5px;accent-color:var(--navy);width:auto;flex:none}
  .opt.sel{border-color:var(--navy);background:#EEF3F8}
  .passage{background:var(--paper);border-left:4px solid var(--navy);border-radius:8px;padding:16px 20px;margin-bottom:18px;line-height:1.75;max-width:72ch}
  .passage h3{margin:0 0 8px;font-size:17px;text-align:center}
  .passage p{margin:0 0 10px}
  .bank{font-style:italic;margin:6px 0 12px} .bank b{font-style:normal}
  .dline{margin:6px 0;line-height:2.1}
  .dline select{width:auto;display:inline-block;padding:4px 8px;margin:0 3px;font-size:14px;border:1.5px solid var(--navy);border-radius:6px}
  .dline select.empty{border-style:dashed;color:var(--muted)}
  .topic{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;cursor:pointer;display:block;max-width:720px}
  .topic.sel{border-color:var(--navy);background:#EEF3F8}
  .topic b{color:var(--navy-deep)} .topic ul{margin:6px 0 0;padding-left:20px;font-size:14px}
  .topic input{accent-color:var(--navy);margin-right:6px;width:auto;display:inline-block;vertical-align:middle}
  textarea.essay-in{width:100%;min-height:220px;padding:14px;border:1.5px solid var(--line);border-radius:10px;font:15px/1.7 'Poppins',sans-serif;margin-top:10px}
  .wc{font-size:13px;margin-top:4px;color:var(--muted)} .wc.ok{color:var(--ok);font-weight:600} .wc.bad{color:var(--red-dark);font-weight:600}
  .details{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px}
  .missing{outline:2px solid var(--red);outline-offset:4px;border-radius:8px}
  .qbar{position:sticky;bottom:0;background:var(--navy-deep);color:#fff;border-radius:12px 12px 0 0;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px;z-index:3}
  .qbar .timer{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
  .qbar .timer.low{color:#FFB4B8}
  .qbar .sp{flex:1}
  .modal{position:fixed;inset:0;background:rgba(24,58,87,.5);display:grid;place-items:center;z-index:10;padding:20px}
  .modal .box{background:#fff;border-radius:14px;padding:24px;max-width:440px;width:100%}
  .modal h3{margin:0 0 8px;color:var(--navy-deep)}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  /* ── results ── */
  .hero{background:var(--navy);color:#fff;border-radius:14px;padding:26px 30px;margin-bottom:18px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .hero .big{font-size:52px;font-weight:700;line-height:1}
  .hero .big small{font-size:22px;font-weight:500;color:#D6E4F0}
  .hero .parts{display:flex;gap:10px;flex-wrap:wrap}
  .hero .parts span{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;font-size:14px}
  .hero .parts b{display:block;font-size:18px}
  .rv{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;border-left:5px solid var(--ok)}
  .rv.no{border-left-color:var(--red)}
  .rv .qt{font-weight:600}
  .rv .o{padding:3px 8px;border-radius:6px;margin:2px 0;font-size:14px;max-width:640px}
  .rv .o.right{background:var(--ok-bg);color:var(--ok);font-weight:600}
  .rv .o.wrong{background:var(--warn-bg);color:var(--red-dark);text-decoration:line-through}
  .rv .why{font-size:14px;margin-top:6px;color:var(--ink);background:var(--paper);border-radius:8px;padding:8px 12px}
  .rv .why::before{content:"Why: ";font-weight:600}
  .aibox{white-space:pre-wrap;background:var(--paper);border-radius:10px;padding:16px;line-height:1.7;max-width:76ch}
  .spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media print{ header, footer, .qbar, .noprint{display:none!important} body{background:#fff} .paper{border:0} }
  @media (max-width:640px){ .paper{padding:18px} .secbar{margin:22px -18px 16px} .cover{grid-template-columns:44px 1fr 44px} .cover img{width:44px;height:44px} .hero .big{font-size:40px} }
  .covers{background:#EEF3F8;border:1px solid #C9D7E6;border-left:5px solid var(--navy);border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:14px;line-height:1.6}
  .covers .ck{font-weight:700;color:var(--navy-deep);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .now .covers{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);border-left-color:var(--cyan);color:#fff;margin:10px 0 20px;max-width:620px}
  .now .covers .ck{color:#D6E4F0}
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .ov{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .ov h3{margin:0 0 2px;font-size:16px;color:var(--navy-deep)}
  .diff{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
  .diff.Easy{background:var(--ok-bg);color:var(--ok)} .diff.Medium{background:#FFF4E5;color:#8A4B00} .diff.Hard{background:var(--warn-bg);color:var(--red-dark)}
  .bars{margin:10px 0} .bars div{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0} .bars span.l{width:150px;color:var(--muted)}
  .ov ol{margin:6px 0 0;padding-left:18px;font-size:13px} .ov ol li{margin:4px 0} .ov .rule{color:var(--muted);font-style:italic}
  .tchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
  .tchips span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-weight:600}
  .tchips span.mid{background:#FFF4E5;color:#8A4B00} .tchips span.low{background:var(--warn-bg);color:var(--red-dark)}
  .wlist{margin:4px 0 10px;padding-left:20px;font-size:14px} .wlist li{margin:3px 0}
  .workon{font-size:12px;color:var(--ink);max-width:260px;white-space:normal}
  .inspick{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 22px}
  .inspick h2{margin:0 0 6px} .inspick select{max-width:420px;margin:10px 0 14px}
  .insbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#EEF3F8;border-radius:10px;padding:10px 14px;margin:0 0 20px;font-size:14px}
  .insbar b{color:var(--navy-deep)} .insbar a{cursor:pointer}
  .notebox{background:#FFF8E1;border:1px solid #F1D48A;border-left:5px solid #E0A100;border-radius:10px;padding:12px 16px;margin:0 0 16px}
  .notebox b{color:#6B4A00} .notecell{font-size:12px;color:#6B4A00;margin-top:4px}
  .ctlbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;background:#fff}
  .ctlbox h3{margin:0 0 8px;font-size:15px;color:var(--navy-deep)}
  .ctlrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
  .ctlrow select,.ctlrow input{width:auto;min-width:120px}
  .lvtabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}.lvtabs button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:700;color:var(--navy);text-align:left}
  .lvtabs button small{display:block;font-weight:400;color:var(--muted);font-size:12px}.lvtabs button.on{border-color:var(--navy);background:var(--navy);color:#fff}.lvtabs button.on small{color:#D9E1E8}
  .wkcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}.wkhead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
  .wkcard .t{font-weight:700}.wkcard .l{font-size:13px;color:var(--muted);margin-top:2px}.gbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  .gbtn{border:1.5px solid var(--line);background:#F3F6F9;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px;color:var(--muted)}
  .gbtn b{color:var(--navy)}.gbtn.on{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}.gbtn.on b{color:var(--ok)}
  .chipx{display:inline-flex;gap:6px;align-items:center;background:#EEF3F8;border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;margin:3px 4px 3px 0}
  .chipx button{border:0;background:#fff;border-radius:999px;cursor:pointer;padding:2px 8px}
  .classlist textarea{width:100%;min-height:150px;font-family:inherit}
  .viewas{background:#FFF4E5;border:1px solid #F1C27D;border-radius:10px;padding:10px 14px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#6B3A00}
  .viewas b{color:#6B3A00}
  .plan{background:#FDECEE;border:1px solid #F3B6BC;border-left:6px solid var(--red);border-radius:12px;padding:16px 20px;margin:0 0 16px}
  .plan h3{margin:0 0 4px;color:var(--red-dark);font-size:18px}
  .plan h4{margin:14px 0 4px;color:var(--navy-deep);font-size:14px}
  .plan ul,.plan ol{margin:4px 0 0;padding-left:20px} .plan li{margin:6px 0}
  .plan .ex{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .plan .ex b{color:var(--ink)}
  .fixrule{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
  .fixrule h3{margin:0 0 10px;font-size:15px;color:var(--navy-deep)}
  .fixq{margin:12px 0 4px;font-weight:600} .fixq small{font-weight:400;color:var(--muted)}
  .tplan{margin-top:10px;font-size:13px;border-left:3px solid var(--red);background:#fff;padding:10px 12px;border-radius:8px}.tplan h4{margin:0 0 6px;font-size:14px}.tplan>div{margin:4px 0}
  .cmlist{margin:6px 0 0 18px;padding:0;font-size:13px}.cmlist li{margin:6px 0}
  .fixopts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
  .fixopts button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit}
  .fixopts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
  .fixopts button.no{border-color:var(--red);background:var(--warn-bg);color:var(--red-dark);text-decoration:line-through}
  .fixwhy{font-size:13px;margin:4px 0 0;color:var(--ink)} .fixwhy b{color:var(--ok)}
  .examgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:0 0 16px}
  .flag{display:inline-block;background:#FFF4E5;color:#8A4B00;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;cursor:help}
  .flags{background:#FFF4E5;border-radius:10px;padding:12px 16px;margin:0 0 14px;color:#6B3A00}
  .flags li{margin:3px 0}
  .notice{background:#EEF3F8;border-left:4px solid var(--navy);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:18px}
  details.more{margin-top:18px} details.more summary{cursor:pointer;font-weight:600;color:var(--navy-deep);font-size:17px;margin-bottom:10px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;display:none}
  .loading{color:var(--muted);padding:30px 0}

  @media (max-width:640px){
    .brand h1{font-size:18px} .brand img{width:44px;height:44px}
    .now{padding:22px} .now h3{font-size:24px}
    .term li{grid-template-columns:52px 1fr;} .term li .pill{grid-column:2;justify-self:start}
    .wk{width:44px;height:44px}
    .stats{grid-template-columns:1fr 1fr 1fr} .stat b{font-size:20px} .stats[style]{grid-template-columns:1fr 1fr !important}
  }
  @media (prefers-reduced-motion:reduce){ .drawer{transition:none} }

  .ls2{border:2px solid var(--red, #E11D2A)}
  .lsplan li{margin:6px 0}
  .lsclock{font-size:18px;margin:14px 0 8px}.lsclock b{font-size:26px;color:var(--navy-deep,#26547C)}
  .lsrec{font-weight:700;color:#B8141F;margin:6px 0}.lsrec .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#E11D2A;margin-right:6px;animation:lsb 1s infinite}
  @keyframes lsb{50%{opacity:.2}}
  .meter{height:10px;background:#EEF1F6;border-radius:99px;overflow:hidden;margin:4px 0 8px}.meter div{height:100%;width:0;background:linear-gradient(90deg,#32D583,#FDB022,#F04438);transition:width .1s}
  .lsheard{min-height:54px;background:#F9FAFB;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:6px 0 10px;font-size:15px}
  .lsq{font-size:18px;font-weight:700;margin:6px 0}.lshelp{margin:4px 0 8px 18px}.lsread p{font-size:19px;line-height:1.6;margin:8px 0}
  .lsreadrv{font-size:17px;line-height:1.9}.okw{color:#1E7F4F}.missw{color:#B8141F;text-decoration:underline wavy}
  .lswords{display:flex;flex-wrap:wrap;gap:6px}.lsword{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;cursor:pointer}
  .lsscores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}.lsscores div{background:#F3F6F9;border-radius:10px;padding:8px;text-align:center}.lsscores b{display:block;font-size:20px}.lsscores span{font-size:12px;color:var(--muted)}
  @media (max-width:560px){.lsscores{grid-template-columns:repeat(3,1fr)}}
  .lsans{margin:10px 0}
  .retakebox{background:#FDECEC;border:2px solid var(--red);border-radius:12px;padding:14px 18px;margin:14px 0}
  .retakebox h3{margin:0 0 6px;color:var(--red-dark)}
  .retakebox a.start{margin-top:6px}
  .pill.donep{background:#E4F4EB;color:#1E7F4F;font-weight:700}
  section.now.done{border-color:#1E7F4F}
  section.now.done .tag{background:#1E7F4F}
  a.start.ghostlink{background:#fff;color:var(--navy);border:2px solid var(--navy)}.lshelpbox{background:#F3F6F9;border-radius:10px;padding:10px 14px;margin:10px 0}.lshelpbox ol{margin:6px 0 0 18px;padding:0}.lshelpbox li{margin:4px 0}.aibox.good{background:#ECFDF3;border-color:#ABEFC6;margin-top:6px}
  mark{background:#FEF0C7;border-bottom:2px solid #F79009;padding:0 2px;border-radius:3px}
</style>

      var buf = new Uint8Array(an.fftSize);
      timer = setInterval(function(){
        an.getByteTimeDomainData(buf); var s = 0; for (var i = 0; i < buf.length; i++){ var v = (buf[i] - 128) / 128; s += v * v; }
        var rms = Math.sqrt(s / buf.length), now = Date.now();
        if (meterEl) meterEl.style.width = Math.min(100, Math.round(rms * 400)) + '%';
        if (now - t0 < 600){ calib.push(rms); floor = Math.max(0.012, Math.min(0.06, calib.reduce(function(a, b){ return a + b; }, 0) / calib.length * 2.2)); return; }
        if (rms > floor){
          self.voiced += 0.1;
          if (!firstV) firstV = now;
          if (silentFrom && lastV){ var gap = (now - silentFrom) / 1000; if (gap > 2){ self.pauses++; self.longest = Math.max(self.longest, gap); } }
          silentFrom = 0; lastV = now;
        } else if (!silentFrom) silentFrom = now;
      }, 100);
    } catch (e) { self.audio = false; }
  }
  function stopMeter(){ try { clearInterval(timer); } catch (e) {} try { ctx && ctx.close(); } catch (e) {} }
  var lastResAt = 0;
  function listen(){
    rec = new SR(); rec.lang = 'en-US'; rec.continuous = !LS_AND; rec.interimResults = true;   // Android: one phrase per session, restarted (avoids repeated words)
    var mine = [];
    rec.onresult = function(ev){
      interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++){
        var tx = ev.results[i][0].transcript;
        if (ev.results[i].isFinal){
          var last = mine.length ? mine[mine.length - 1] : null;
          if (last !== null && tx.toLowerCase().trim().indexOf(finals[last].toLowerCase().trim()) === 0) finals[last] = tx;   // Android repeats the phrase so far
          else { finals.push(tx); mine.push(finals.length - 1); }
        } else interim += tx;
      }
      var now = Date.now();
      if (!self.audio){                         // no meter: estimate pauses from when words arrive
        if (!firstV) firstV = now;
        if (lastResAt){ var gap = (now - lastResAt) / 1000; if (gap > 2.5){ self.pauses++; self.longest = Math.max(self.longest, gap - 0.5); } }
        lastV = now; self.voiced = (lastV - firstV) / 1000;
      }
      lastResAt = now;
      if (self.onText) self.onText(self.text());
    };
    rec.onerror = function(e){
      self.error = e.error || 'error';
      if (e.error === 'audio-capture' && stream){ stopMeter(); self.audio = false; try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch (x) {} stream = null; }
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ stopped = true; if (self.onFail) self.onFail(e.error); }
    };
    rec.onend = function(){ if (!stopped){ try { listen(); } catch (x) {} } };
    try { rec.start(); } catch (x) {}
  }
  self.text = function(){ return (finals.join(' ') + ' ' + interim).replace(/\s+/g, ' ').trim(); };
  self.start = function(){
    t0 = Date.now(); startMeter(); listen();
    if (meterEl && !stream && meterEl.parentNode) meterEl.parentNode.style.display = 'none';
    // Safety: the meter hears a voice but no words arrive → give the microphone to speech recognition only.
    setTimeout(function(){
      if (stopped || lastResAt || !self.audio || self.voiced < 2) return;
      stopMeter(); self.audio = false; lsFreeMic(stream); stream = null; self.freed = true;
      if (meterEl && meterEl.parentNode) meterEl.parentNode.style.display = 'none';
      try { rec.abort(); } catch (e) {}
    }, 6000);
  };
  self.stop = function(){
    stopped = true; try { rec && rec.stop(); } catch (e) {}
    return new Promise(function(res){ setTimeout(function(){
      stopMeter(); try { rec && rec.abort(); } catch (e) {}
      var end = Date.now(), span = firstV ? ((lastV || end) - firstV) / 1000 : 0;
      res({ text: self.text(), m: { secs: Math.round(span), pauses: self.pauses, longest: Math.round(self.longest * 10) / 10, voiced: Math.round(self.voiced), audio: self.audio, total: Math.round((end - t0) / 1000) } });
    }, 1300); });
  };
}

function lsCountdown(el, secs, onEnd){
  var end = Date.now() + secs * 1000, h = setInterval(function(){
    var left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); el.textContent = left;
    if (!left){ clearInterval(h); onEnd(); }
  }, 200);
  el.textContent = secs; return function(){ clearInterval(h); };
}

  html += '<div class="paper"><h2 style="margin-top:0">🎤 Speaking' + (r.total !== null && r.total !== undefined ? ': ' + r.total + ' / 20' : '') + '</h2>';
  if (r.status === 'waiting for AI') html += '<p id="lswait"><span class="spin"></span>Your speaking feedback is being prepared. ' + (opts.aiNow ? 'This takes a few seconds…' : 'Check <b>My results</b> later.') + '</p>';
  if (r.status === 'no speech') html += '<div class="notice">We could not hear any speech. Check your microphone next time and speak clearly.</div>';
  if ((r.scores || []).length){
    html += '<div class="lsscores">' + r.scores.map(function(c){ return '<div><b>' + (c.score === null ? '…' : c.score + '/4') + '</b><span>' + esc(c.name) + '</span></div>'; }).join('') + '</div>';
  }
  (r.speak || []).forEach(function(s, i){
    html += '<div class="lsans"><p class="lsq">' + ((r.speak || []).length > 1 ? (i + 1) + '. ' : '') + esc(s.q) + '</p>' +
      '<div class="aibox"><b>What the browser heard:</b><br>' + (s.text ? lsHighlight(s.text, r.feedback && r.feedback.mistakes) : '<i>(nothing)</i>') + '</div>' +
      (s.m ? '<p class="muted" style="margin:4px 0 0">' + s.m.secs + ' seconds · ' + s.m.words + ' words · ' + s.m.wpm + ' words a minute · ' + s.m.pauses + ' long pause' + (s.m.pauses === 1 ? '' : 's') + '</p>' : '') +
      (r.feedback && r.feedback.corrected && r.feedback.corrected[i] ? '<div class="aibox good"><b>A better version:</b><br>' + esc(r.feedback.corrected[i]) + '</div>' : '') + '</div>';
  });
  if (r.feedback){
    if ((r.feedback.mistakes || []).length) html += '<p style="margin:10px 0 4px;font-weight:700">Your mistakes</p><ul class="wlist">' + r.feedback.mistakes.map(function(m){ return '<li>You said: "' + esc(m.said) + '" → Better: "' + esc(m.better) + '"</li>'; }).join('') + '</ul>';
    if ((r.feedback.tips || []).length) html += '<p style="margin:10px 0 4px;font-weight:700">Tips for next time</p><ul class="wlist">' + r.feedback.tips.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    html += '<p class="muted" style="font-size:12px">The browser sometimes hears words wrongly, and it can hide small mistakes. Your instructor can check this mark.</p>';
  }
  if (r.comment) html += '<div class="notebox"><b>Note from ' + esc(r.instructor || 'your instructor') + ':</b> ' + esc(r.comment) + '</div>';
  html += '</div>';
  return html;
}
function lsRenderReview(r, aiNow, sid, id){
  if (!r){ app.innerHTML = '<div class="none">No Part 2 answers yet.</div>'; return; }
  app.innerHTML = '<div class="bar noprint"><h2 style="margin:0">Part 2: Listening &amp; Speaking — your result</h2><span class="sp"></span><a class="btn ghost" href="' + BASE + '?view=results">My results</a></div>' +
    (r.counts ? '<div class="notice">Added to your quiz mark: <b>Listening ' + (r.lsPoints && r.lsPoints.listening !== null ? r.lsPoints.listening : 0) + ' / 5</b> and <b>Speaking ' + (r.lsPoints && r.lsPoints.speaking !== null ? r.lsPoints.speaking + ' / 5' : (r.status === 'waiting for AI' ? '(being marked)' : '0 / 5')) + '</b> (your speaking score out of 20, divided by 4).</div>'
      : '<div class="notice">Practice: these scores do not change the mark of this test.</div>') + lsReviewHtml(r, { aiNow: aiNow });
  lsWireSay(); var rp = document.getElementById('lsreplay'); if (rp && r.listen) rp.onclick = function(){ lsPlayLines(r.listen.lines); };
  if (r.status === 'waiting for AI' && aiNow){
    (function poll(n){
      call('markSpeaking', id || r.id).then(function(x){
        if (x.status === 'marked') return call('getMySpeaking', r.key, sid).then(function(r2){ lsRenderReview(r2, false, sid); });
        if (n < 6) return setTimeout(function(){ poll(n + 1); }, 4000);
        var w = document.getElementById('lswait'); if (w) w.innerHTML = 'Your speaking feedback is being prepared. It will be ready in a few minutes: check <b>My results</b> later.';
      }).catch(function(){ if (n < 3) setTimeout(function(){ poll(n + 1); }, 5000); });
    })(0);
  }
}

/* ── instructors: Speaking tab ── */
function renderSpeaking(){
  var pane = document.getElementById('pane'), all = state.data.speaking || [], f = state.spf || (state.spf = { level: '', key: '', group: '', only: '' });
  if (!all.length){ pane.innerHTML = '<div class="card empty"><strong>No listening &amp; speaking answers yet.</strong><br>After Part 1 of a weekly quiz or a mock test, students go on to Part 2 (listening and speaking, practice only). Their answers appear here.</div>'; return; }
  var vals = function(k){ return uniq(all.map(function(r){ return String(r[k]); })); };
  var list = all.filter(function(r){ return (!f.level || r.level === f.level) && (!f.key || r.key === f.key) && (!f.group || r.group === f.group) &&
    (!f.only || (f.only === 'flags' ? r.flags : f.only === 'wait' ? r.status === 'waiting for AI' : f.only === 'retake' ? !!r.retake : r.total !== null && r.total < 10)); })
    .sort(function(a, b){ return b.submitted - a.submitted; });
  var sel = function(k, label, opts){ return '<label>' + label + ' <select data-spf="' + k + '"><option value="">All</option>' + opts.map(function(o){ return '<option' + (o === f[k] ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>'; };
  var marked = list.filter(function(r){ return r.total !== null && !r.retake; }), avg = marked.length ? Math.round(marked.reduce(function(s, r){ return s + r.total; }, 0) / marked.length * 10) / 10 : null;
  var li = list.filter(function(r){ return r.listening !== null; }), lavg = li.length ? Math.round(li.reduce(function(s, r){ return s + r.listening; }, 0) / li.length * 10) / 10 : null;
  pane.innerHTML = '<div class="notice" style="margin-top:0">Part 2 of each weekly quiz and mock test: listening, read-aloud and free speaking. In <b>weekly quizzes it counts: Listening 5 + Speaking 5 points</b> (speaking out of 20 ÷ 4). In mock tests it is practice. ' +
    'The AI marks speaking from what the browser heard; you can add a comment (the student sees it) and change the score. ⚑ notes are for you only.</div>' +
    '<div class="ctlrow" style="flex-wrap:wrap;margin:10px 0">' + sel('level', 'Level', vals('level')) + sel('key', 'Quiz', vals('key')) + sel('group', 'Group', vals('group')) +
    '<label>Show <select data-spf="only"><option value="">Everyone</option><option value="help"' + (f.only === 'help' ? ' selected' : '') + '>Under 10/20</option><option value="flags"' + (f.only === 'flags' ? ' selected' : '') + '>⚑ With notes</option><option value="wait"' + (f.only === 'wait' ? ' selected' : '') + '>Waiting for the AI</option><option value="retake"' + (f.only === 'retake' ? ' selected' : '') + '>Retake to do</option></select></label></div>' +
    '<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b>' + list.length + '</b><span>Answers</span></div><div class="stat"><b>' + (avg === null ? '—' : avg + ' / 20') + '</b><span>Speaking average</span></div><div class="stat"><b>' + (lavg === null ? '—' : lavg + ' / 5') + '</b><span>Listening average</span></div></div>' +
    '<div class="tablewrap"><table><thead><tr><th>Student</th><th>Group</th><th>Quiz</th><th class="n">Listening</th><th class="n">Read aloud</th><th class="n">Speaking</th><th></th><th></th></tr></thead><tbody>' +
    list.map(function(r){
      return '<tr><td><b>' + esc(r.name) + '</b><br><span class="muted">' + esc(r.sid) + '</span></td><td>' + esc(r.group) + '</td><td>' + esc(r.key) + '</td>' +
        '<td class="n">' + (r.listening === null ? '—' : r.listening + '/5') + '</td><td class="n">' + (r.read === null ? '—' : r.read + '%') + '</td>' +
        '<td class="n"><b>' + (r.retake ? '<span style="color:var(--red-dark)">Retake to do</span>' : r.total !== null ? r.total + '/20' : r.status === 'speaking later' ? 'Not done' : r.status === 'waiting for AI' ? 'AI soon' : '—') + '</b>' + (r.adjusted ? '<br><span class="muted">changed</span>' : '') + '</td>' +
        '<td>' + (r.flags ? '<span class="flag">⚑ ' + r.flags + '</span>' : '') + (r.comment ? ' 📝' : '') + '</td><td><button class="btn small" data-sp="' + esc(r.id) + '">Open</button></td></tr>';
    }).join('') + '</tbody></table></div>';
  pane.querySelectorAll('[data-spf]').forEach(function(s){ s.onchange = function(){ f[s.dataset.spf] = s.value; renderSpeaking(); }; });
  pane.querySelectorAll('[data-sp]').forEach(function(b){ b.onclick = function(){ openSpeaking(b.dataset.sp); }; });
}
function openSpeaking(id){
  var d = openDrawer('Listening & speaking', 'Part 2 of the quiz');
  d.body.innerHTML = '<p class="loading">Loading…</p>';
  call('getSpeakingDetail', state.token, id).then(function draw(r){
    var ro = state.data && state.data.me && state.data.me.viewAs;
    d.body.innerHTML = '<h3 style="margin:0 0 4px">' + esc(r.name) + ' <span class="muted">' + esc(r.sid) + ' · ' + esc(r.group) + ' · ' + esc(r.key) + '</span></h3>' +
      ((r.flags || []).length ? '<div class="flags"><b>Things to check</b> (signs, not proof; talk to the student first):<ul>' + r.flags.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      (r.note ? '<p class="muted">AI note: ' + esc(r.note) + '</p>' : '') +
      (r.measures && r.measures.browser ? '<p class="muted" style="font-size:12px">Device: ' + esc(r.measures.browser) + (r.markedBy ? ' · Marked by ' + esc(r.markedBy) : '') + '</p>' : '') +
      lsReviewHtml(r, { instructor: true }) +
      '<div class="ctlbox"><h3>Your comment and score</h3><p class="muted" style="margin:0 0 6px">The student sees your comment. Change the score only if the AI got it wrong (out of 20; in weekly quizzes it becomes ÷ 4 points of the quiz mark).</p>' +
      '<textarea id="spc" rows="3" style="width:100%"' + (ro ? ' disabled' : '') + '>' + esc(r.comment || '') + '</textarea>' +
      '<div class="ctlrow" style="margin-top:8px"><label>Score <input id="spa" type="number" min="0" max="20" step="0.5" style="width:90px" value="' + (r.adjusted === null || r.adjusted === undefined ? '' : r.adjusted) + '" placeholder="' + (r.total === null || r.total === undefined ? '' : r.total) + '"' + (ro ? ' disabled' : '') + '></label>' +
      '<button class="btn" id="sps"' + (ro ? ' disabled' : '') + '>Save</button></div></div>' +
      '<div class="ctlbox"><h3>Speaking retake</h3>' + (r.retake ? '<p style="margin:0"><b>Retake to do.</b> ' + (r.retake === 'instructor' ? 'You gave a retake.' : 'The browser heard nothing, so the student must do the speaking again.') + ' The student sees a ⚠ box on the quiz website until it is done.</p>'
        : '<p class="muted" style="margin:0 0 6px">The student does the speaking again (read aloud and speaking). The listening mark is kept. Until then the speaking counts as not done.</p><button class="btn ghost" id="sprt"' + (ro || r.status === 'speaking later' ? ' disabled' : '') + '>Give a speaking retake</button>') + '</div>';
    lsWireSay(d.body);
    var rp = d.body.querySelector('#lsreplay'); if (rp && r.listen) rp.onclick = function(){ lsPlayLines(r.listen.lines); };
    var rb = d.body.querySelector('#sprt');
    if (rb) rb.onclick = function(){ modal('<h3>Give a speaking retake?</h3><p>' + esc(r.name) + ' will do the speaking of ' + esc(r.key) + ' again. The current speaking score is removed until the retake.</p>', 'Yes, give a retake', function(){
      rb.disabled = true; call('giveSpeakingRetake', state.token, id).then(function(r2){ toast('Retake given'); draw(r2); refreshSpeaking(); }).catch(function(e){ rb.disabled = false; toast(errMsg(e)); }); }); };
    var sb = d.body.querySelector('#sps');
    if (sb) sb.onclick = function(){ sb.disabled = true; call('saveSpeakingReview', state.token, id, d.body.querySelector('#spc').value, d.body.querySelector('#spa').value)
      .then(function(r2){ toast('Saved'); draw(r2); refreshSpeaking(); }).catch(function(e){ sb.disabled = false; toast(errMsg(e)); }); };
  }).catch(function(e){ d.close(); handleErr(e); });
}
function refreshSpeaking(){ call('getDashboard', state.token).then(function(x){ state.data.speaking = x.speaking; if (state.tab === 'speaking') renderSpeaking(); }).catch(function(){}); }

document.getElementById('homeLink').href = API || '#';
if (!API || !QUIZKEY || !SID) app.innerHTML = '<div class="none"><strong>Please open Part 2 from the quiz website.</strong><br>Do Part 1 of your weekly quiz, then press "Go to Part 2".</div>';
else lsView();
</script>
</body>
</html>
