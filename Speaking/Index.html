<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Speak Up · Listening &amp; Speaking</title>
</head>
<body style="margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1B2733;background:#F3F6F9">
<p id="m" style="padding:28px 20px;margin:0">Loading…</p>
<script>
/* Speak Up loader: the page itself comes from the quiz website, so this file never needs updating. */
(function () {
  var DEF = 'https://script.google.com/macros/s/AKfycbxw4GLLZtkOmrLA_UInwhpSyZ8qzhQeG_zMO_AkM7sm7L_RPRnvZOo0Rm_psy202MXAlQ/exec';
  var api = new URLSearchParams(location.search).get('api') || DEF;
  if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[\w-]+\/(exec|dev)$/.test(api)) api = DEF;
  window.LOADER_API = api;
  function fail() { document.getElementById('m').innerHTML = 'The page could not load. Check your internet, then <a href="#" onclick="location.reload();return false">try again</a>.'; }
  function go(n) {
    fetch(api, { method: 'POST', body: JSON.stringify({ fn: 'speakPageHtml', args: [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.err) || 'empty'); document.open(); document.write(j.ok); document.close(); })
      .catch(function () { if (n < 3) setTimeout(function () { go(n + 1); }, 1500 * (n + 1)); else fail(); });
  }
  go(0);
})();
</script>
</body>
</html>
